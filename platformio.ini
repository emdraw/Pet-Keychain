; Llavero Amigo - PlatformIO configuration
;
; Build + flash over USB : pio run -e esp32c3 -t upload
; Flash over WiFi (OTA)  : pio run -e esp32c3_ota -t upload
;
; Your private OTA settings (IP/host and password) go in platformio_local.ini,
; which is git-ignored. See platformio_local.ini.example.
[platformio]
extra_configs = platformio_local.ini

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = lovyan03/LovyanGFX@^1.2.0
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3_ota]
extends = env:esp32c3
upload_protocol = espota
upload_port = llavero.local
